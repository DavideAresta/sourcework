name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# On a public repository every fork's pull request runs this file. Nothing here
# writes anything back, so the token it gets should not be able to either -
# stated rather than inherited, because the default is a repository setting and
# a repository setting can change without a commit.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[ingest,dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        # SOURCEWORK_LLM__STUB is set by tests/conftest.py, so the suite needs no
        # API key, no network and no CLI - which is the point of stub mode.
        run: pytest -q

      - name: Smoke test the whole pipeline
        # Eight agents over real A2A JSON-RPC against a deterministic fake model.
        # Catches the wiring failures a unit test cannot see.
        run: python scripts/demo.py

  cloud:
    # The hosted distribution in its own job, so its packages never share a
    # venv with core: pip-installing sourcework-cloud would register its
    # `sourcework.auth` entry point, and core's own suite expects the no-plugin
    # install it ships in. Cloud tests resolve the package off the repo path
    # (cloud/tests/conftest.py), so only the Postgres driver needs installing.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sourcework_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[ingest,dev]" "psycopg[binary]" psycopg_pool

      - name: Cloud tests
        env:
          SOURCEWORK_CLOUD__TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sourcework_cloud_test
        run: pytest -q cloud/tests

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[ingest]" "psycopg[binary]" psycopg_pool
          pip install pip-licenses

      - name: No copyleft dependencies
        # This project is MIT. A GPL/AGPL/SSPL dependency arriving through a
        # transitive bump would change what downstream users are allowed to do,
        # and it should fail here rather than be discovered by a lawyer.
        # The check lives in a tested script: the grep it replaced passed a
        # package licensed "GNU General Public License v3".
        run: |
          pip-licenses --format=csv --with-system > licences.csv
          python scripts/check_licences.py licences.csv

      - uses: actions/upload-artifact@v4
        with:
          name: licences
          path: licences.csv
