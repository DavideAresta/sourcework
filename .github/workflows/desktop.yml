name: Desktop

# The Tauri shell's build. Kept out of ci.yml because it is a different
# toolchain on three operating systems, and the Python jobs should not wait for
# a webview to compile. Mirrored by the `desktop` jobs in .gitlab-ci.yml.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup default stable

      - name: Linux webview, tray and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Tauri CLI
        # The Rust crate, not the npm package: this front end has no build step
        # and nothing here needs the JavaScript bindings.
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the shell and its bundles
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

  rust-licences:
    # The Python gate (ci.yml) does not see the shell's Rust tree; this is its
    # half of the same rule: a copyleft crate must fail here, not at a lawyer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup default stable
      - name: cargo-deny
        run: cargo install cargo-deny --locked
      - name: No copyleft crates
        working-directory: desktop/src-tauri
        run: cargo deny --config deny.toml check licenses

  attach:
    # Releases are created by hand; this only hangs the built bundles on one.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach the bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # `--repo` explicitly: this job has no checkout, so `gh` cannot derive
          # the repository from a git remote and fails with "not a git
          # repository" - which is how the first 0.6.0 run lost its attach step
          # after all three bundles had built.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" \
                 --title "SourceWork ${TAG#v}" --generate-notes
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' \
               -o -name '*.exe' -o -name '*.dmg' \) -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber
