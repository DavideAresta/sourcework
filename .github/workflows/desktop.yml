name: Desktop

# The Tauri shell's build. Kept out of ci.yml because it is a different
# toolchain on three operating systems, and the Python jobs should not wait for
# a webview to compile. Mirrored by the `desktop` jobs in .gitlab-ci.yml.
#
# It is also the reusable half of the release: `release.yml` calls it with the
# tag its bump job just created, so the installers are built from the released
# source rather than from whatever the caller happened to have checked out.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build. Empty means the triggering ref.
        type: string
        required: false
        default: ""
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Rust
        run: rustup default stable

      - uses: actions/setup-python@v5
        with:
          # The host interpreter only runs the fetch script; the runtime it
          # installs is the bundled one.
          python-version: "3.12"

      - name: Embed a Python runtime and install SourceWork
        # A relocatable CPython for this runner's triple, with the project
        # pip-installed at the tag being built. `tauri build` then bundles
        # `desktop/src-tauri/python/` as a resource, so the installer needs no
        # Python on the user's machine.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_python.py --dest desktop/src-tauri/python --install .

      - name: Linux webview, tray and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Tauri CLI
        # The Rust crate, not the npm package: this front end has no build step
        # and nothing here needs the JavaScript bindings.
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the shell and its bundles
        working-directory: desktop/src-tauri
        env:
          # linuxdeploy and the AppImage plugin are themselves AppImages, and a
          # runner without FUSE cannot mount them - the bundle step dies with a
          # bare "failed to run linuxdeploy". Extract-and-run sidesteps the
          # mount; it is ignored by the deb/msi/dmg bundlers.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

  rust-licences:
    # The Python gate (ci.yml) does not see the shell's Rust tree; this is its
    # half of the same rule: a copyleft crate must fail here, not at a lawyer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Rust
        run: rustup default stable
      - name: cargo-deny
        run: cargo install cargo-deny --locked
      - name: No copyleft crates
        working-directory: desktop/src-tauri
        run: cargo deny --config deny.toml check licenses

  attach:
    # For a tag pushed by hand. Automated releases go through release.yml, which
    # calls this workflow and hangs the bundles on the release itself.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach the bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # `--repo` explicitly: this job has no checkout, so `gh` cannot derive
          # the repository from a git remote and fails with "not a git
          # repository" - which is how the first 0.6.0 run lost its attach step
          # after all three bundles had built.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" \
                 --title "SourceWork ${TAG#v}" --generate-notes
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' \
               -o -name '*.exe' -o -name '*.dmg' \) -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber
