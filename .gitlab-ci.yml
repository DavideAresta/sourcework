# Mirror of .github/workflows/ci.yml. Both exist because the project is
# mirrored; whichever side a change lands on has to stay green.

stages: [lint, test, licences]

default:
  image: python:3.12-slim
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/pip]
  before_script:
    - pip install -q -e ".[ingest,dev]"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

lint:
  stage: lint
  script:
    - ruff check src tests

test:
  stage: test
  parallel:
    matrix:
      - PY: ["3.11", "3.12", "3.13"]
  image: python:$PY-slim
  script:
    # Stub mode comes from tests/conftest.py, so no API key, no network, no CLI.
    - pytest -q
    # Eight agents over real A2A JSON-RPC against a deterministic fake model:
    # catches the wiring failures a unit test cannot see.
    - python scripts/demo.py

cloud:
  # The hosted distribution in its own job, so its packages never share a venv
  # with core: pip-installing sourcework-cloud would register its
  # `sourcework.auth` entry point, and core's own suite expects the no-plugin
  # install it ships in. Cloud tests resolve the package off the repo path
  # (cloud/tests/conftest.py), so only the Postgres driver needs installing.
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16
      alias: postgres
      command: ["-c", "listen_addresses=*"]
  variables:
    SOURCEWORK_CLOUD__TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sourcework_cloud_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: sourcework_cloud_test
  script:
    - pip install -q -e ".[ingest,dev]" "psycopg[binary]" psycopg_pool
    - pytest -q cloud/tests

licences:
  stage: licences
  before_script:
    - pip install -q -e ".[ingest]" "psycopg[binary]" psycopg_pool pip-licenses
  script:
    # This project is MIT. A copyleft dependency arriving through a transitive
    # bump would change what downstream users may do, and it should fail here
    # rather than be discovered by a lawyer. The check lives in a tested script:
    # the grep it replaced passed a package licensed "GNU General Public
    # License v3".
    - pip-licenses --format=csv --with-system > licences.csv
    - python scripts/check_licences.py licences.csv
  artifacts:
    paths: [licences.csv]
    expire_in: 30 days
