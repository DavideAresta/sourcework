[package]
name = "sourcework-desktop"
version = "0.6.10"
description = "The SourceWork desktop shell: a window, a tray, and the backend's lifecycle"
edition = "2021"
# Tauri v2's own floor. Stated so a too-old toolchain fails with a clear message
# rather than a wall of dependency errors.
rust-version = "1.77.2"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP for the two things the shell asks the backend: is it up, and
# what runs have finished. Small and rustls-based; the shell is not a server.
ureq = { version = "2", features = ["json"] }

[profile.release]
# The shell ships alongside a ~300 MB Python runtime; there is no reason for it
# to also be a 20 MB binary.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
