# `cargo deny check licenses` for the desktop shell's Rust tree.
#
# The same rule as the Python gate in scripts/check_licences.py: this project is
# MIT, and a copyleft dependency arriving through a transitive bump would change
# what downstream users may do. Only the *allow* list passes; GPL, AGPL and SSPL
# are not on it and never should be.
#
# MPL-2.0 is here because it is a file-level, not project-level, copyleft - the
# same judgement the Python gate makes for LGPL: importing is fine, and the
# desktop shell links these crates rather than vendoring them.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    # The TLS root certificates ureq ships (webpki-roots). A permissive data
    # licence, not a code one, but it still has to be named here.
    "CDLA-Permissive-2.0",
]
# A licence file that names several of the above (dual/triple licensing) is
# accepted when one of them is allowed.
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
