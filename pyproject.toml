[project]
name = "sourcework"
# One version, in the package, read at build time. It was written out twice and
# hand-kept in step, which is a bug waiting for the release where somebody bumps
# one of them.
dynamic = ["version"]
description = "Agentic PRD generation over the A2A protocol: documents, transcripts, images and Confluence in -> a traceable PRD out."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Davide Aresta" }]
keywords = ["prd", "agents", "a2a", "llm", "requirements", "confluence", "local-models"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "litellm>=1.55",
  "tenacity>=8.3",
  "python-multipart>=0.0.9",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
ingest = [
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  # For tests/test_compose.py. Already present transitively via
  # uvicorn[standard]; declared here so the one test that reads YAML does not
  # depend on that staying true. MIT, so the licence gate is untroubled.
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/DavideAresta/sourcework"
Source = "https://github.com/DavideAresta/sourcework"
Issues = "https://github.com/DavideAresta/sourcework/issues"

[project.scripts]
sourcework = "sourcework.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sourcework/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcework"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: (str, Enum) is deliberate - StrEnum changes JSON-schema generation
# in a way pydantic consumers here rely on.
ignore = ["E501", "UP042"]
