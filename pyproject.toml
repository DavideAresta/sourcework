[project]
name = "prdforge"
version = "0.1.0"
description = "Agentic PRD generation over the A2A protocol: documents, transcripts, images and Confluence in -> a traceable PRD out."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Davide Aresta" }]
keywords = ["prd", "agents", "a2a", "llm", "requirements", "confluence", "local-models"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://gitlab.com/LudusFaber/prd-forge"
Source = "https://gitlab.com/LudusFaber/prd-forge"
Issues = "https://gitlab.com/LudusFaber/prd-forge/-/issues"

dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "litellm>=1.55",
  "tenacity>=8.3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ingest = [
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
prdforge-agent = "prdforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prdforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: (str, Enum) is deliberate - StrEnum changes JSON-schema generation
# in a way pydantic consumers here rely on.
ignore = ["E501", "UP042"]
