<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · SourceWork</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    /* Applied before first paint. This has to be a blocking classic script: the
       page's module runs after parse, which is late enough to show one frame of
       the wrong theme. */
    try {
      var t = localStorage.getItem("sourcework.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">Source<b>Work</b><span id="version" class="version"></span></div>
    <div class="spacer"></div>
    <a href="/"><button class="ghost">Runs</button></a>
    <button id="refresh" class="ghost">Refresh</button>
    <button id="theme" class="ghost">Auto</button>
    <a href="/settings"><button class="ghost">Settings</button></a>
  </header>

  <main class="centred">
    <h1>PRD status</h1>
    <p class="muted">
      One row per document, newest finished version. <b>Ready</b> means the critic
      raised nothing blocking, no blocking question is unanswered, and no recorded
      conflict is unresolved.
    </p>

    <div id="totals" class="grid4" style="margin:18px 0 24px"></div>
    <div id="board"></div>
  </main>

  <script type="module" src="/static/js/theme.js"></script>
  <script type="module" src="/static/js/dashboard.js"></script>
</body>
</html>
