<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SourceWork</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    /* Applied before first paint. This has to be a blocking classic script: the
       page's module runs after parse, which is late enough to show one frame of
       the wrong theme. */
    try {
      var t = localStorage.getItem("sourcework.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">Source<b>Work</b><span id="version" class="version"></span></div>
    <span id="mesh" class="pill">checking…</span>
    <div class="spacer"></div>
    <button id="theme" class="ghost">Auto</button>
    <a href="/dashboard"><button class="ghost">Dashboard</button></a>
    <a href="/settings"><button class="ghost">Settings</button></a>
  </header>

  <div class="layout">
    <aside>
      <button id="new-run" class="primary" style="width:100%">+ New PRD</button>
      <button id="history-toggle" class="side-title" aria-controls="runs">History</button>
      <div id="runs"></div>
    </aside>
    <main id="main"></main>
  </div>

  <script type="module" src="/static/js/theme.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
